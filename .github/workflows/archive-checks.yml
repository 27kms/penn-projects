name: Archive checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: archive-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read repository source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}" > source.tar.gz
          mkdir source
          tar -xzf source.tar.gz --strip-components=1 -C source
      - name: Check archive integrity and documentation
        working-directory: source
        run: python3 scripts/check_archive.py
